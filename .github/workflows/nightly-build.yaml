name: Nightly Build
on:
  schedule:
    - cron: '0 8 * * *' # UTC time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tag:
    name: Check if main branch is a dev version
    runs-on: ubuntu-latest
    if: github.repository == 'jimlee2048/nunchaku'
    outputs:
      need_build: ${{ steps.check.outputs.need_build }}
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Extract version from __version__.py
        id: version
        run: |
          version=$(grep '__version__' nunchaku/__version__.py | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Extracted version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Determine if build is needed
        id: check
        run: |
          version="${{ steps.version.outputs.version }}"
          need_build=false
          if [[ "$version" == *dev* ]]; then
            echo "Version contains 'dev'"
            prefix="v$version"
            tag=$(git tag --list "${prefix}*" --sort=-creatordate | head -n 1 || echo "")
            if [ -z "$tag" ]; then
              echo "No previous tag found."
              need_build=true
            else
              base=$(git rev-parse "$tag")
              head=$(git rev-parse HEAD)
              if [ "$base" != "$head" ]; then
                echo "New commits found since $tag"
                need_build=true
              else
                echo "No new commits since $tag"
              fi
            fi
          else
            echo "Version does not contain 'dev'"
          fi
          echo "need_build=$need_build" >> "$GITHUB_OUTPUT"
      - name: Set tag name
        id: tag
        if: steps.check.outputs.need_build == 'true'
        run: |
          today=$(date -u +"%Y%m%d")
          tag_name="v${{ steps.version.outputs.version }}$today"
          echo "tag_name=$tag_name"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
      - name: Create and push tag
        if: steps.check.outputs.need_build == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag ${{ steps.tag.outputs.tag_name }}
          git push origin ${{ steps.tag.outputs.tag_name }}
      - name: Ensure GitHub prerelease exists
        if: steps.check.outputs.need_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.tag.outputs.tag_name }}
        run: |
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --verify-tag --prerelease --title "Nunchaku Nightly $TAG_NAME"
          fi
      - name: Skip tagging (version is not dev or no new commits)
        if: steps.check.outputs.need_build == 'false'
        run: echo "Version is not a dev version or no new commits. Skipping tag."
  linux-wheels:
    name: Build the linux nightly wheels
    runs-on: ubuntu-24.04
    needs: tag
    if: needs.tag.outputs.need_build == 'true' && github.repository == 'jimlee2048/nunchaku'
    strategy:
      max-parallel: 2
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        torch: ["2.13", "pre"]
        cuda: ["13.0"] # Phase 2: expand to ["12.6", "13.0", "13.2"] after validation.
    steps:
      - name: Prepare Docker storage
        run: |
          sudo systemctl stop docker
          sudo find /var/lib/docker -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
      - name: Maximize Docker build space
        uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
        with:
          build-mount-path: /var/lib/docker
          build-mount-path-ownership: root:root
          root-reserve-mb: 16384
          swap-size-mb: 8192
          remove-android: 'true'
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
      - name: Start Docker and show resources
        run: |
          sudo systemctl start docker
          free -h
          df -h
          docker info
      - name: Checkout to the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.tag_name }}
          submodules: true
      - name: Show current commit
        run: git log -1 --oneline
      - name: Build wheels
        run: |
          if [[ "${{ matrix.torch }}" == "pre" ]]; then
            bash scripts/build_linux_wheel_torch_nightly.sh ${{ matrix.python }} ${{ matrix.torch }} ${{ matrix.cuda }} 1
          else
            bash scripts/build_linux_wheel.sh ${{ matrix.python }} ${{ matrix.torch }} ${{ matrix.cuda }} 1
          fi
      - name: Upload wheels to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          name: Nunchaku Nightly ${{ needs.tag.outputs.tag_name }}
          tag_name: ${{ needs.tag.outputs.tag_name }}
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  windows-wheels:
    name: Build the windows nightly wheels
    runs-on: windows-2025
    needs: tag
    if: needs.tag.outputs.need_build == 'true' && github.repository == 'jimlee2048/nunchaku'
    env:
      CUDA_VERSION_MAP: >-
        {
          "13.0": "13.0.2"
        }
    strategy:
      max-parallel: 2
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        torch: ["2.13", "pre"]
        cuda: ["13.0"] # Phase 2: expand to ["12.6", "13.0", "13.2"] after validation.
    steps:
      - name: Checkout to the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.tag_name }}
          submodules: true
      - name: Show current commit
        shell: cmd
        run: git log -1 --oneline
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d
        id: cuda-toolkit
        with:
          cuda: ${{ fromJSON(env.CUDA_VERSION_MAP)[matrix.cuda] }}
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "cccl", "nvtx", "visual_studio_integration"]'
          use-local-cache: false
          use-github-cache: false
          log-file-suffix: nightly-py${{ matrix.python }}-torch${{ matrix.torch }}-cu${{ matrix.cuda }}
      - name: Show resources and toolchain
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem
          Get-CimInstance Win32_OperatingSystem | Select-Object TotalVisibleMemorySize, FreePhysicalMemory
          nvcc --version
      - name: Build wheels
        shell: cmd
        run: |
          IF "${{ matrix.torch }}"=="pre" (
            call scripts\build_windows_wheel_torch_nightly.cmd ${{ matrix.python }} ${{ matrix.torch }} ${{ matrix.cuda }} 1
          ) ELSE (
            call scripts\build_windows_wheel.cmd ${{ matrix.python }} ${{ matrix.torch }} ${{ matrix.cuda }} 1
          )
      - name: Upload wheels to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          name: Nunchaku Nightly ${{ needs.tag.outputs.tag_name }}
          tag_name: ${{ needs.tag.outputs.tag_name }}
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
