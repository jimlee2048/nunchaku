name: Release Build
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild (leave empty to use the version on main)
        required: false
        type: string
permissions:
  contents: write
jobs:
  release:
    name: Tag Main Branch and Create Release
    runs-on: ubuntu-latest
    if: github.repository == 'jimlee2048/nunchaku'
    outputs:
      tag_name: ${{ steps.set-tag.outputs.tag_name }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Extract version from __version__.py
        id: version
        run: |
          version=$(grep '__version__' nunchaku/__version__.py | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set tag name
        id: set-tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          SOURCE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            tag_name="$REQUESTED_TAG"
            if ! git show-ref --verify --quiet "refs/tags/$tag_name"; then
              echo "Tag $tag_name does not exist."
              exit 1
            fi
          else
            if [[ "$SOURCE_VERSION" == *dev* ]]; then
              echo "Refusing to create a normal release for development version $SOURCE_VERSION."
              exit 1
            fi
            tag_name="v$SOURCE_VERSION"
          fi
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
      - name: Check if tag exists
        id: check-tag
        run: |
          tag_name="${{ steps.set-tag.outputs.tag_name }}"
          if git show-ref --verify --quiet "refs/tags/$tag_name"; then
            echo "Tag $tag_name already exists."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $tag_name does not exist."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create and push tag if not exists
        if: steps.check-tag.outputs.exists == 'false'
        run: |
          tag_name="${{ steps.set-tag.outputs.tag_name }}"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag "$tag_name"
          git push origin "$tag_name"
  linux-wheels:
    name: Build the linux release wheels
    runs-on: [self-hosted, linux-build]
    needs: release
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        torch: ["2.13", "pre"]
        cuda: ["13.0"] # Phase 2: expand to ["12.6", "13.0", "13.2"] after validation.
    steps:
      - name: Checkout to the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.tag_name }}
          submodules: true
      - name: Use current wheel build scripts for an existing tag
        if: inputs.tag != ''
        run: |
          git fetch origin main
          git checkout FETCH_HEAD -- scripts/build_linux_wheel.sh scripts/build_linux_wheel_torch_nightly.sh scripts/linux_cleanup.sh
      - name: Show current commit
        run: git log -1 --oneline
      - name: Build wheels
        run: |
          if [[ "${{ matrix.torch }}" == "pre" ]]; then
            bash scripts/build_linux_wheel_torch_nightly.sh ${{ matrix.python }} ${{ matrix.torch }} ${{ matrix.cuda }}
          else
            bash scripts/build_linux_wheel.sh ${{ matrix.python }} ${{ matrix.torch }} ${{ matrix.cuda }}
          fi
      - name: Upload wheels to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          name: Nunchaku ${{ needs.release.outputs.tag_name }}
          tag_name: ${{ needs.release.outputs.tag_name }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # - name: Upload wheels to HuggingFace Hub
      #   env:
      #     HF_TOKEN: ${{ secrets.HF_WHEEL_UPLOAD_TOKEN }}
      #   run: |
      #     pip install huggingface_hub
      #     for whl in dist/*.whl; do
      #       hf upload nunchaku-tech/nunchaku "$whl"
      #     done
      - name: Clean up
        if: always()
        run: bash scripts/linux_cleanup.sh
  windows-wheels:
    name: Build the windows release wheels
    runs-on: [self-hosted, win-build]
    needs: release
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        torch: ["2.13", "pre"]
        cuda: ["13.0"] # Phase 2: expand to ["12.6", "13.0", "13.2"] after validation.
    steps:
      - name: Checkout to the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.tag_name }}
          submodules: true
      - name: Use current wheel build scripts for an existing tag
        if: inputs.tag != ''
        shell: cmd
        run: |
          git fetch origin main
          git checkout FETCH_HEAD -- scripts/build_windows_wheel.cmd scripts/build_windows_wheel_torch_nightly.cmd
      - name: Show current commit
        shell: cmd
        run: git log -1 --oneline
      - name: Build wheels
        shell: cmd
        run: |
          call C:\Users\nunchaku\miniconda3\condabin\activate.bat activate
          IF "${{ matrix.torch }}"=="pre" (
            call scripts\build_windows_wheel_torch_nightly.cmd ${{ matrix.python }} ${{ matrix.torch }} ${{ matrix.cuda }} 8
          ) ELSE (
            call scripts\build_windows_wheel.cmd ${{ matrix.python }} ${{ matrix.torch }} ${{ matrix.cuda }} 8
          )
      - name: Upload wheels to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          name: Nunchaku ${{ needs.release.outputs.tag_name }}
          tag_name: ${{ needs.release.outputs.tag_name }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
